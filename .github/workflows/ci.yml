name: ci

# This repository tests its own reusable security workflow on itself.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/security.yml
